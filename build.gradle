plugins {
    id 'net.fabricmc.fabric-loom' version '1.16.2'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}


repositories {
    mavenLocal()
    maven { url "https://maven.nucleoid.xyz" }
    maven { url "https://repo.opencollab.dev/main/" }
    maven { url "https://repo.lucko.me/" }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation 'org.orsa:squid-staff-commands:1.0'
    compileOnly "me.lucko:fabric-permissions-api:0.7.0"
    implementation "eu.pb4:polymer-common:${project.polymer_version}"
    implementation "eu.pb4:polymer-core:${project.polymer_version}"
    implementation "eu.pb4:polymer-resource-pack:${project.polymer_version}"
    implementation "eu.pb4:polymer-sound-patcher:${project.polymer_version}"
    implementation "eu.pb4:polymer-resource-pack-extras:${project.polymer_version}"
    implementation "eu.pb4:polymer-blocks:${project.polymer_version}"
    implementation "eu.pb4:polymer-reg-sync-manipulator:${project.polymer_version}"
    implementation "eu.pb4:polymer-autohost:${project.polymer_version}"
    implementation "eu.pb4:polymer-networking:${project.polymer_version}"
    implementation "eu.pb4:polymer-virtual-entity:${project.polymer_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(targetJavaVersion)
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
        // Add repositories to publish to here.
    }
}
